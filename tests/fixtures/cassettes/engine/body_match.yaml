# Hand-crafted control for the body match. The request body is what the LiteLLM
# adapter sends for the prompt in tests/replay/engine/test_body_match.py.
interactions:
  - request:
      body: '{"messages":[{"role":"user","content":"Was ist Inqtrix?"}],"model":"gpt-4o","max_tokens":64000,"stream":false}'
      headers:
        accept:
          - application/json
        content-type:
          - application/json
      method: POST
      uri: http://localhost:4000/v1/chat/completions
    response:
      body:
        string: |
          {
            "id": "chatcmpl-replay-body-match",
            "object": "chat.completion",
            "created": 1745000000,
            "model": "gpt-4o",
            "choices": [
              {
                "index": 0,
                "message": {"role": "assistant", "content": "Inqtrix recherchiert iterativ."},
                "finish_reason": "stop"
              }
            ],
            "usage": {"prompt_tokens": 12, "completion_tokens": 6, "total_tokens": 18}
          }
      headers:
        content-type:
          - application/json
      status:
        code: 200
        message: OK
version: 1
