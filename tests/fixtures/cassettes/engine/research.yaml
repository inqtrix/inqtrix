      (\u2192 ALWAYS search). DIRECT only for what needs no source at all: greetings,
      arithmetic, rewording or translating a given text.\\n2. In which language is
      the question written?\\n3. In which language are the best search results found?
      (e.g. programming/tech/science \u2192 often English, local topics/politics/law
      \u2192 the language of the question)\\n4. How recent must the sources be? Decide
      by what the question asks for, not by the dates it names:\\n   - NONE: the question
      does not ask for the latest state: definitions, history, explanations, and what
      laws, rules or standards require (obligations, deadlines, exceptions), also
      from a future date\\n   - MONTH: developments or changes of the last weeks,
      the current status of an ongoing procedure (a bill, a negotiation), the latest
      version of something that changes often\\n   - WEEK: news of the last days,
      current events\\n   - DAY: breaking news, live data, today's events\\n   - HOUR:
      real-time events, breaking news happening right now\\n   A date in the question
      (e.g. 'from 2027') names the period the answer is about, not how recent the
      sources must be.\\n5. Which search type fits best?\\n   - GENERAL: standard
      web search\\n   - ACADEMIC: scientific questions, studies, papers\\n   - NEWS:
      news, current events, reports\\n6. Which ANSWER FORM does the question demand?\\n
