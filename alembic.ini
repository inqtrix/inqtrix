# Alembic configuration for the inqtrix platform schema.
#
# The database URL is deliberately NOT configured here: the env script
# resolves it from INQTRIX_DATABASE_URL (the documented env exception
# for migration tooling) or from a programmatically injected
# connection (tests). Run via `uv run inqtrix-migrate` or
# `uv run alembic upgrade head`.

[alembic]
script_location = src/inqtrix/storage/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
