# The surrounding normalized location owns these values. Guest SPA fallbacks
# use a named location so an internal /index.html redirect cannot downgrade
# privacy headers or bearer-token log redaction.
add_header Cache-Control $inqtrix_static_cache_control always;
add_header Referrer-Policy $inqtrix_guest_referrer_policy always;
add_header X-Content-Type-Options $inqtrix_guest_content_type_options always;
# Repeated on purpose: an add_header list in a location REPLACES the server
# block's list, so the baseline must be restated wherever a location sets its
# own headers.
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security $inqtrix_hsts always;
