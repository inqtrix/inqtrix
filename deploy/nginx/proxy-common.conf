# Shared HTTP and WebSocket proxy contract. Route declarations include this
# file so forwarding, streaming, credential, and timeout behaviour cannot
# drift between /api, /v1, health, and collaboration endpoints.
proxy_pass $inqtrix_backend;
proxy_http_version 1.1;
proxy_pass_request_headers on;

# A Connection option can nominate any field as hop-by-hop. nginx has no
# built-in dynamic "remove the named field" primitive, so the template rejects
# unknown options before proxying. Fixed hop fields are removed explicitly.
if ($inqtrix_invalid_connection_options) {
    return 400;
}

proxy_set_header Host $inqtrix_forwarded_host;
proxy_set_header X-Forwarded-Host $inqtrix_forwarded_host;
proxy_set_header X-Forwarded-Proto $inqtrix_forwarded_scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Origin $http_origin;
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie $http_cookie;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_set_header X-Inqtrix-Guest-CSRF $http_x_inqtrix_guest_csrf;
proxy_set_header X-Inqtrix-Workspace-Id $http_x_inqtrix_workspace_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $inqtrix_connection_upgrade;
proxy_set_header Keep-Alive "";
proxy_set_header Proxy-Authenticate "";
proxy_set_header Proxy-Authorization "";
proxy_set_header TE "";
proxy_set_header Trailer "";

proxy_hide_header Keep-Alive;
proxy_hide_header Proxy-Authenticate;
proxy_hide_header Proxy-Authorization;
proxy_hide_header TE;
proxy_hide_header Trailer;

# Requests and responses stay streaming for uploads, SSE, and WebSockets.
# Seven days approximates the Python gateway's unbounded upstream read while
# retaining an eventual cleanup boundary for abandoned sockets.
proxy_request_buffering off;
proxy_buffering off;
proxy_cache off;
proxy_connect_timeout 60s;
proxy_read_timeout 7d;
proxy_send_timeout 3600s;
proxy_next_upstream off;
