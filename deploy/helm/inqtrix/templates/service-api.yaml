apiVersion: v1
kind: Service
metadata:
  name: {{ include "inqtrix.fullname" . }}-api
  labels:
    {{- include "inqtrix.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "inqtrix.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.apiPort }}
      targetPort: http
      protocol: TCP
