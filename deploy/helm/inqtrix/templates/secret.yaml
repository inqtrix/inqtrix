{{- if hasKey .Values.secret.data "INQTRIX_MIGRATION_DATABASE_URL" }}
{{- fail "secret.data.INQTRIX_MIGRATION_DATABASE_URL is forbidden in the runtime application Secret; use migrations.databaseSecret instead" }}
{{- end }}
{{- if and .Values.secret.existingSecret (not (empty .Values.secret.data)) }}
{{- fail "secret.existingSecret and secret.data are mutually exclusive; keep one authoritative Secret source" }}
{{- end }}
{{- if .Values.postgres.enabled }}
{{- if or (hasKey .Values.secret.data "INQTRIX_DATABASE_URL") (hasKey .Values.secret.data "INQTRIX_BUNDLED_POSTGRES_PASSWORD") }}
{{- fail "bundled Postgres credentials come only from postgres.auth; do not also set secret.data.INQTRIX_DATABASE_URL or secret.data.INQTRIX_BUNDLED_POSTGRES_PASSWORD" }}
{{- end }}
{{- end }}
{{- if .Values.valkey.enabled }}
{{- if or (hasKey .Values.secret.data "INQTRIX_VALKEY_URL") (hasKey .Values.secret.data "INQTRIX_BUNDLED_VALKEY_PASSWORD") }}
{{- fail "bundled Valkey credentials come only from valkey.password; do not also set secret.data.INQTRIX_VALKEY_URL or secret.data.INQTRIX_BUNDLED_VALKEY_PASSWORD" }}
{{- end }}
{{- end }}
{{- if and .Values.qdrant.enabled (hasKey .Values.secret.data "INQTRIX_QDRANT_API_KEY") }}
{{- fail "bundled Qdrant credentials come only from qdrant.apiKey; do not also set secret.data.INQTRIX_QDRANT_API_KEY" }}
{{- end }}
{{- if .Values.s3.enabled }}
{{- if or (hasKey .Values.secret.data "INQTRIX_S3_ACCESS_KEY") (hasKey .Values.secret.data "INQTRIX_S3_SECRET_KEY") }}
{{- fail "bundled MinIO credentials come only from s3.accessKey/s3.secretKey; do not also set secret.data.INQTRIX_S3_ACCESS_KEY or secret.data.INQTRIX_S3_SECRET_KEY" }}
{{- end }}
{{- end }}
{{- if and (or .Values.postgres.enabled .Values.valkey.enabled .Values.qdrant.enabled .Values.s3.enabled) (not .Values.secret.create) (not .Values.secret.existingSecret) }}
{{- fail "bundled services require either secret.create=true or secret.existingSecret with every required backing-service credential" }}
{{- end }}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- range $key, $rawValue := .Values.secret.data }}
{{- $value := include "inqtrix.requiredCredentialValue" (dict "name" (printf "secret.data.%s" $key) "value" $rawValue) }}
{{- end }}
{{- /*
Chart-managed Secret (dev convenience). Bundled backing services auto-wire their
secret connection settings from their one service-specific values block.
secret.data remains available for external services and application/provider
credentials, but may not override derived bundled-service keys.
*/}}
{{- /* Route URL construction through the helpers (single source) so their
       password-charset guards always apply -- do NOT rebuild the URLs inline. */}}
{{- $derived := dict }}
{{- if .Values.postgres.enabled }}
{{- $postgresPassword := include "inqtrix.requiredCredentialValue" (dict "name" "postgres.auth.password" "value" .Values.postgres.auth.password) }}
{{- /* The APP url routes through PgBouncer when bundled; the migrate hook
       keeps the direct URL via its own "inqtrix.databaseUrl" reference. */}}
{{- $_ := set $derived "INQTRIX_DATABASE_URL" (include "inqtrix.appDatabaseUrl" .) }}
{{- $_ := set $derived "INQTRIX_BUNDLED_POSTGRES_PASSWORD" $postgresPassword }}
{{- end }}
{{- if .Values.valkey.enabled }}
{{- $valkeyPassword := include "inqtrix.requiredCredentialValue" (dict "name" "valkey.password" "value" .Values.valkey.password) }}
{{- $_ := set $derived "INQTRIX_VALKEY_URL" (include "inqtrix.valkeyUrl" .) }}
{{- $_ := set $derived "INQTRIX_BUNDLED_VALKEY_PASSWORD" $valkeyPassword }}
{{- end }}
{{- if .Values.qdrant.enabled }}
{{- $qdrantApiKey := include "inqtrix.requiredCredentialValue" (dict "name" "qdrant.apiKey" "value" .Values.qdrant.apiKey) }}
{{- $_ := set $derived "INQTRIX_QDRANT_API_KEY" $qdrantApiKey }}
{{- end }}
{{- if .Values.s3.enabled }}
{{- $s3AccessKey := include "inqtrix.requiredCredentialValue" (dict "name" "s3.accessKey" "value" .Values.s3.accessKey) }}
{{- $s3SecretKey := include "inqtrix.requiredCredentialValue" (dict "name" "s3.secretKey" "value" .Values.s3.secretKey) }}
{{- if lt (len $s3SecretKey) 8 }}
{{- fail "s3.secretKey must contain at least 8 characters when the bundled S3 service is enabled" }}
{{- end }}
{{- $_ := set $derived "INQTRIX_S3_ACCESS_KEY" $s3AccessKey }}
{{- $_ := set $derived "INQTRIX_S3_SECRET_KEY" $s3SecretKey }}
{{- end }}
{{- $merged := merge (deepCopy .Values.secret.data) $derived }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inqtrix.fullname" . }}
  labels:
    {{- include "inqtrix.labels" (dict "root" .) | nindent 4 }}
type: Opaque
{{- with $merged }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
