{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inqtrix.serviceAccountName" . }}
  labels:
    {{- include "inqtrix.labels" (dict "root" .) | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- range $component := list "api" "worker" }}
{{- $workload := index $.Values.serviceAccount $component }}
{{- if and (not $workload.create) $workload.annotations }}
{{- fail (printf "serviceAccount.%s.annotations requires serviceAccount.%s.create=true; annotations cannot be applied to an externally managed account" $component $component) }}
{{- end }}
{{- if $workload.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inqtrix.workloadServiceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "inqtrix.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- with $workload.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $workload.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- if .Values.serviceAccount.create }}
{{- range $component := list "web" "test" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inqtrix.internalServiceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "inqtrix.labels" (dict "root" $ "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.collaboration.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inqtrix.internalServiceAccountName" (dict "root" . "component" "collaboration") }}
  labels:
    {{- include "inqtrix.labels" (dict "root" . "component" "collaboration") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.migrations.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inqtrix.internalServiceAccountName" (dict "root" . "component" "migrate") }}
  labels:
    {{- include "inqtrix.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ if .Values.postgres.enabled }}pre-install,post-install,pre-upgrade{{ else }}pre-install,pre-upgrade{{ end }}
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: false
{{- end }}
{{- end }}
