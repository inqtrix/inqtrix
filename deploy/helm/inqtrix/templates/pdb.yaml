{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "inqtrix.fullname" . }}-api
  labels:
    {{- include "inqtrix.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "inqtrix.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
{{- if .Values.web.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "inqtrix.fullname" . }}-web
  labels:
    {{- include "inqtrix.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "inqtrix.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
{{- end }}
